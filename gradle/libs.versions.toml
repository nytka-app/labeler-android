[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
core-ktx = "1.19.1"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
okhttp = "5.5.0"
