name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # In the same workflow on purpose: a tag pushed with GITHUB_TOKEN starts no other workflow.
  apk:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # The signing secrets live in this environment, which only protected branches can use.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode the keystore
        env:
          KEYSTORE: ${{ secrets.NYTKA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/labeler.jks"
      - name: Build the release APK
        env:
          NYTKA_KEYSTORE_FILE: ${{ runner.temp }}/labeler.jks
          NYTKA_KEYSTORE_PASSWORD: ${{ secrets.NYTKA_KEYSTORE_PASSWORD }}
          NYTKA_KEY_ALIAS: ${{ secrets.NYTKA_KEY_ALIAS }}
          NYTKA_KEY_PASSWORD: ${{ secrets.NYTKA_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease
      - name: Verify the signature and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "labeler-$VERSION.apk"
          gh release upload "$TAG" "labeler-$VERSION.apk" --repo "$GITHUB_REPOSITORY"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/labeler.jks"
